[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "litevault"
version = "1.1.0"
description = "Personal .litematic collection manager with 3D viewer"
requires-python = ">=3.11"
dependencies = [
    "nicegui>=2.0.0",
    "sqlmodel>=0.0.19",
    "pywebview>=5.0.0",
    "nucleation>=0.1.0",
    "pillow>=10.0.0",
    "aiofiles>=23.0.0",
    "nbtlib>=2.0.4",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0.0",
]

[project.scripts]
litevault = "app.main:run"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
allow-direct-references = true
